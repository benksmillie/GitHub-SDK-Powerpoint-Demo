name: Primer Design System Reviewer
description: Automated design system compliance checker for Primer guidelines

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  design-review:
    name: Design System Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm install -g @primer/css
          npm install -g eslint eslint-plugin-primer-react
          
      - name: Run Primer Design Review
        run: |
          echo "🎨 Reviewing code against Primer Design System guidelines..."
          echo "Checking for Primer component usage..."
          
      - name: Check Component Usage
        run: |
          # Check for custom button implementations instead of Primer Button
          if grep -r "className.*btn-custom" --include="*.jsx" --include="*.tsx" .; then
            echo "⚠️ Custom button classes found. Use Primer Button component instead."
          fi
          
          # Check for proper heading hierarchy
          if grep -r "<h[1-6]" --include="*.jsx" --include="*.tsx" .; then
            echo "ℹ️ HTML headings found. Consider using Primer Heading component."
          fi
          
      - name: Accessibility Check
        run: |
          echo "♿ Checking accessibility requirements..."
          # Check for missing alt text
          if grep -r "<img" --include="*.jsx" --include="*.tsx" . | grep -v "alt="; then
            echo "⚠️ Images without alt text found."
          fi
          
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🎨 Primer Design System Review\n\n✅ Design system compliance check complete. Please review the guidelines in `.github/copilot-instructions.md`'
            })
